services:
  - type: web
    name: finding-love-malawi
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: DISK_PATH
        value: /data
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Finding Love Malawi <noreply@findinglovemalawi.com>"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_GOLD
        sync: false
      - key: STRIPE_PRICE_PLATINUM
        sync: false
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
